server:
  port: ${REGULATION_SERVICE_PORT:8082}

law-api:
  # 국가법령정보센터의 공식 API 주소. 호출 대상이 바뀔 때만 수정한다.
  base-url: https://www.law.go.kr
  # 인증값은 로컬 .env 또는 배포 환경 변수에서만 주입하며 Git에 기록하지 않는다.
  oc: ${LAW_API_OC:}
  # 검색 전 좌측 목록을 구성하는 대피·공간 안전 관련 기본 키워드다.
  default-keywords:
    - 소방
    - 피난
    - 건축
    - 다중이용업소
    - 재난
    - 시설안전

spring:
  application:
    name: regulation-service

  # OpenAI 연동은 아직 활성화하지 않는다.
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

  datasource:
    url: ${REGULATION_DB_URL:jdbc:mysql://localhost:3307/hwalro_regulation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${REGULATION_DB_USERNAME:hwalro_regulation}
    password: ${REGULATION_DB_PASSWORD:hwalro_regulation}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:hwalro-auth-service}

auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

  # Spring AI Configuration
  # ai:
  #   openai:
  #     api-key: ${OPENAI_API_KEY}

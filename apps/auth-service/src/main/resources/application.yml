server:
  port: ${AUTH_SERVICE_PORT:8080}

spring:
  application:
    name: auth-service

  # Datasource (MySQL)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hwalro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 스키마 자동 초기화 (개발용. idempotent: CREATE IF NOT EXISTS + INSERT IGNORE)
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

  # Redis (Refresh Token 저장)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  issuer: ${JWT_ISSUER:hwalro-auth-service}

# Cookie Configuration
cookie:
  same-site: ${COOKIE_SAME_SITE:Lax}
  secure: ${COOKIE_SECURE:false}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

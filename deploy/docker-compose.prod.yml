services:
  mysql:
    image: mysql:8.4
    container_name: hwalro-prod-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hwalro_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      SIMULATION_DB_PASSWORD: ${SIMULATION_DB_PASSWORD}
      REGULATION_DB_PASSWORD: ${REGULATION_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ../apps/auth-service/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
      - ../apps/simulation-service/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/02-simulation-schema.sql:ro
      - ../apps/regulation-service/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/03-regulation-schema.sql:ro
      - ../db/grants.sh:/docker-entrypoint-initdb.d/04-grants.sh:ro
      - ../apps/auth-service/src/main/resources/db/dml.sql:/docker-entrypoint-initdb.d/05-auth-dml.sql:ro
      - ../apps/regulation-service/src/main/resources/db/safety-check-dml.sql:/docker-entrypoint-initdb.d/06-safety-check-dml.sql:ro
      - ../apps/simulation-service/src/main/resources/db/density-threshold-dml.sql:/docker-entrypoint-initdb.d/07-density-threshold-dml.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --protocol=TCP -h 127.0.0.1 -P 3306 -uroot',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hwalro-network

  redis:
    image: redis:8-alpine
    container_name: hwalro-prod-redis
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hwalro-network

  auth-service:
    image: ${REGISTRY_URL}/auth-service:${AUTH_TAG:-latest}
    container_name: hwalro-prod-auth-service
    restart: always
    environment:
      TZ: Asia/Seoul
      AUTH_DB_URL: jdbc:mysql://mysql:3306/hwalro_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-hwalro_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-3s}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      JWT_ISSUER: ${JWT_ISSUER:-hwalro-auth-service}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DB_INIT_MODE: ${DB_INIT_MODE:-never}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hwalro-network

  simulation-service:
    image: ${REGISTRY_URL}/simulation-service:${SIMULATION_TAG:-latest}
    container_name: hwalro-prod-simulation-service
    restart: always
    environment:
      TZ: Asia/Seoul
      SIMULATION_DB_URL: jdbc:mysql://mysql:3306/hwalro_simulation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SIMULATION_DB_USERNAME: ${SIMULATION_DB_USERNAME:-hwalro_simulation}
      SIMULATION_DB_PASSWORD: ${SIMULATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-hwalro-auth-service}
      DB_INIT_MODE: ${DB_INIT_MODE:-never}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hwalro-network

  regulation-service:
    image: ${REGISTRY_URL}/regulation-service:${REGULATION_TAG:-latest}
    container_name: hwalro-prod-regulation-service
    restart: always
    environment:
      TZ: Asia/Seoul
      REGULATION_DB_URL: jdbc:mysql://mysql:3306/hwalro_regulation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REGULATION_DB_USERNAME: ${REGULATION_DB_USERNAME:-hwalro_regulation}
      REGULATION_DB_PASSWORD: ${REGULATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-hwalro-auth-service}
      AUTH_SERVICE_URL: http://auth-service:8080
      SIMULATION_SERVICE_URL: http://simulation-service:8081
      LAW_API_OC: ${LAW_API_OC:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      OPENAI_MAX_COMPLETION_TOKENS: ${OPENAI_MAX_COMPLETION_TOKENS:-1800}
      OPENAI_RETRY_MAX_ATTEMPTS: ${OPENAI_RETRY_MAX_ATTEMPTS:-3}
      DB_INIT_MODE: ${DB_INIT_MODE:-never}
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      simulation-service:
        condition: service_started
    networks:
      - hwalro-network

  frontend:
    image: ${REGISTRY_URL}/frontend:${FRONTEND_TAG:-latest}
    container_name: hwalro-prod-frontend
    restart: always
    ports:
      - '${FRONTEND_PORT:-80}:80'
    environment:
      NGINX_ENVSUBST_FILTER: AUTH_SERVICE_URL|SIMULATION_SERVICE_URL|REGULATION_SERVICE_URL
      AUTH_SERVICE_URL: auth-service:8080
      SIMULATION_SERVICE_URL: simulation-service:8081
      REGULATION_SERVICE_URL: regulation-service:8082
    depends_on:
      - auth-service
      - simulation-service
      - regulation-service
    networks:
      - hwalro-network

networks:
  hwalro-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

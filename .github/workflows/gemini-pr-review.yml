name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to review'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    if: github.event.sender.login != 'github-actions[bot]'

    steps:
      - name: Resolve PR Context
        id: pr_ctx
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber = null;
            let triggered = false;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              triggered = true;
            } else if (context.eventName === 'issue_comment') {
              if (context.payload.issue.pull_request) {
                const comment = (context.payload.comment.body || '').trim().toLowerCase();
                if (
                  comment === '/review' ||
                  comment === '/gemini-review' ||
                  comment.startsWith('/review ') ||
                  comment.startsWith('/gemini-review ') ||
                  comment.startsWith('@gemini review')
                ) {
                  prNumber = context.payload.issue.number;
                  triggered = true;

                  try {
                    await github.rest.reactions.createForIssueComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: context.payload.comment.id,
                      content: 'eyes'
                    });
                  } catch (e) {
                    core.warning(`Failed to add reaction: ${e.message}`);
                  }
                }
              }
            } else if (context.eventName === 'workflow_dispatch') {
              prNumber = context.payload.inputs.pr_number;
              triggered = true;
            }

            if (!triggered || !prNumber) {
              core.setOutput('should_run', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(prNumber)
            });

            core.setOutput('should_run', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('title', pr.title || '');
            core.setOutput('body', pr.body || '');

      - name: Checkout PR branch
        if: steps.pr_ctx.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_ctx.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch base branch
        if: steps.pr_ctx.outputs.should_run == 'true'
        run: |
          git fetch origin ${{ steps.pr_ctx.outputs.base_ref }}:${{ steps.pr_ctx.outputs.base_ref }} || true

      - name: Generate and Post Gemini Inline Review
        if: steps.pr_ctx.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ steps.pr_ctx.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr_ctx.outputs.title }}
          PR_BODY: ${{ steps.pr_ctx.outputs.body }}
          HEAD_SHA: ${{ steps.pr_ctx.outputs.head_sha }}
          BASE_REF: ${{ steps.pr_ctx.outputs.base_ref }}
        with:
          script: |
            const { execSync } = require('child_process');
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              core.warning('GEMINI_API_KEY secret is not set. Skipping Gemini code review.');
              return;
            }

            const prNumber = Number(process.env.PR_NUMBER);
            const prTitle = process.env.PR_TITLE || '';
            const prBody = process.env.PR_BODY || '';
            const headSha = process.env.HEAD_SHA;
            const baseRef = process.env.BASE_REF || 'main';

            let diff = '';
            try {
              diff = execSync(
                `git diff origin/${baseRef}...HEAD -- . ':!pnpm-lock.yaml' ':!package-lock.json' ':!*.lock' ':!*.svg' ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp' ':!*.ico' ':!*.pdf'`,
                { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 }
              );
            } catch (err) {
              try {
                diff = execSync(
                  `git diff ${baseRef}...HEAD -- . ':!pnpm-lock.yaml' ':!package-lock.json' ':!*.lock'`,
                  { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 }
                );
              } catch (innerErr) {
                try {
                  diff = execSync(
                    `git diff HEAD~1 HEAD -- . ':!pnpm-lock.yaml' ':!package-lock.json' ':!*.lock'`,
                    { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 }
                  );
                } catch (lastDiffErr) {
                  core.setFailed(`Failed to obtain git diff: ${lastDiffErr.message}`);
                  return;
                }
              }
            }

            if (!diff.trim()) {
              core.info('No relevant diff found to review.');
              return;
            }

            const maxDiffLength = 40000;
            const trimmedDiff = diff.length > maxDiffLength
              ? diff.slice(0, maxDiffLength) + '\n\n...[Diff truncated due to size limits]...'
              : diff;

            const systemInstruction = [
              '당신은 숙련된 시니어 소프트웨어 엔지니어이자 코드 리뷰어입니다.',
              '제공된 PR 제목, 본문 설명, Git Diff를 검토하고 건설적이고 구체적인 인라인 리뷰와 전체 요약을 한국어로 작성하세요.',
              '인라인 코멘트 작성 규칙:',
              '1. 반드시 변경된 파일의 새로 추가/수정된 줄 번호(신규 파일 기준 RIGHT side line)를 정확히 지정하세요.',
              '2. 버그 가능성, 보안 취약점, 성능 문제, 예외 처리 누락, 클린 코드 개선점 등 실제 가치 있는 피드백에만 인라인 코멘트를 작성하세요.',
              '3. 문제가 없거나 사소한 변경점에 대해서는 무리하게 인라인 코멘트를 작성하지 말고 빈 배열로 남기세요.',
              '4. summary 필드에는 전체 변경 요약, 주요 리스크, 종합 의견을 Markdown 형식으로 작성하세요.'
            ].join('\n');

            const promptContent = `PR Title: ${prTitle}\nPR Description:\n${prBody}\n\nGit Diff:\n\`\`\`diff\n${trimmedDiff}\n\`\`\``;

            const requestPayload = {
              contents: [
                {
                  role: 'user',
                  parts: [
                    {
                      text: `${systemInstruction}\n\n${promptContent}`
                    }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.2,
                maxOutputTokens: 4096,
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'OBJECT',
                  properties: {
                    summary: {
                      type: 'STRING',
                      description: '전체 변경 요약 및 종합 총평 (Markdown 형식)'
                    },
                    reviews: {
                      type: 'ARRAY',
                      description: '파일의 특정 라인에 남길 인라인 리뷰 목록',
                      items: {
                        type: 'OBJECT',
                        properties: {
                          path: {
                            type: 'STRING',
                            description: '저장소 루트 기준 파일 상대 경로'
                          },
                          line: {
                            type: 'INTEGER',
                            description: '새로운 파일 기준 라인 번호 (diff의 + 라인)'
                          },
                          side: {
                            type: 'STRING',
                            enum: ['RIGHT']
                          },
                          comment: {
                            type: 'STRING',
                            description: '해당 라인에 대한 구체적인 리뷰 코멘트 (Markdown 형식)'
                          }
                        },
                        required: ['path', 'line', 'side', 'comment']
                      }
                    }
                  },
                  required: ['summary', 'reviews']
                }
              }
            };

            const candidateModels = [
              'gemini-3.6-flash',
              'gemini-3.7-flash'
            ];
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let reviewData;
            let lastError = null;

            for (const model of candidateModels) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                  const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestPayload)
                  });

                  if (!res.ok) {
                    const errText = await res.text();
                    lastError = new Error(`Model ${model} attempt ${attempt} error (${res.status}): ${errText}`);
                    core.warning(`[Gemini API] ${model} attempt ${attempt} failed (${res.status}): ${errText}`);
                    if (res.status === 503 || res.status === 429 || res.status >= 500) {
                      const backoffMs = (3000 * Math.pow(2, attempt - 1)) + Math.floor(Math.random() * 1000);
                      await sleep(backoffMs);
                      continue;
                    }
                    break;
                  }

                  const response = await res.json();
                  const candidate = response.candidates?.[0];
                  let responseText = candidate?.content?.parts?.[0]?.text;

                  if (!responseText) {
                    throw new Error(`Empty response from Gemini model ${model}`);
                  }

                  responseText = responseText.trim();
                  if (responseText.startsWith('```json')) {
                    responseText = responseText.replace(/^```json\s*/, '').replace(/\s*```$/, '');
                  } else if (responseText.startsWith('```')) {
                    responseText = responseText.replace(/^```\s*/, '').replace(/\s*```$/, '');
                  }

                  reviewData = JSON.parse(responseText);
                  core.info(`[Gemini API] Successfully generated review using ${model}`);
                  break;
                } catch (err) {
                  lastError = err;
                  core.warning(`[Gemini API] ${model} attempt ${attempt} exception: ${err.message}`);
                  await sleep(2000 * attempt);
                }
              }

              if (reviewData) {
                break;
              }
            }

            if (!reviewData) {
              const errorMessage = lastError ? lastError.message : '일시적인 API 오류';
              core.warning(`Gemini AI code review skipped due to API unavailability/rate limits: ${errorMessage}`);
              
              const noticeBody = [
                '## ⚠️ Gemini AI Code Review 안내',
                '',
                '현재 Gemini API의 일시적인 사용량 급증(Rate Limit) 또는 서비스 부하로 인해 AI 자동 코드 리뷰 생성이 완료되지 못했습니다.',
                '',
                `- **상태**: 일시적 API 지연/제한 발생`,
                `- **재요청 방법**: 이 PR 댓글로 \`/review\` 를 입력하면 즉시 코드 리뷰가 재실행됩니다.`,
                `- **안내**: 담당 리뷰어 및 팀원 분들께서는 수동으로 코드 검토를 진행해 주셔도 됩니다.`
              ].join('\n');

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: noticeBody
                });
              } catch (commentErr) {
                core.warning(`Failed to post notice comment: ${commentErr.message}`);
              }
              return;
            }

            const summaryText = reviewData.summary || '코드 검토가 완료되었습니다.';
            const inlineComments = Array.isArray(reviewData.reviews) ? reviewData.reviews : [];

            const formattedComments = inlineComments
              .filter((item) => item.path && item.line && item.comment)
              .map((item) => ({
                path: item.path.trim(),
                line: Number(item.line),
                side: item.side || 'RIGHT',
                body: item.comment.trim()
              }));

            const reviewHeader = '## 🤖 Gemini AI Code Review\n\n';
            const fullBody = `${reviewHeader}${summaryText}`;

            try {
              if (formattedComments.length > 0) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  commit_id: headSha,
                  body: fullBody,
                  event: 'COMMENT',
                  comments: formattedComments
                });
                core.info(`Successfully posted review with ${formattedComments.length} inline comment(s).`);
              } else {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  commit_id: headSha,
                  body: fullBody,
                  event: 'COMMENT'
                });
                core.info('Successfully posted review summary (no inline comments needed).');
              }
            } catch (reviewErr) {
              core.warning(`Bulk review creation failed (${reviewErr.message}). Fallback to summary comment.`);

              let fallbackBody = `${fullBody}\n\n### 💬 Line-by-line Notes\n`;
              for (const c of formattedComments) {
                fallbackBody += `\n- **\`${c.path}:${c.line}\`**: ${c.body}`;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: fallbackBody
              });
            }
